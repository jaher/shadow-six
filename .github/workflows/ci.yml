name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    # the suite (~1650 cases, per-mission simulations) is split over parallel shards, balanced by the measured
    # per-file timings in tests/unit/durations.json (refresh with `node tests/unit/run.mjs --write-durations`)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: unit-tests (shard ${{ matrix.shard }}/4)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests (pure simulation, no GPU)
        run: node tests/unit/run.mjs --shard=${{ matrix.shard }}/4

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tools
        run: npm ci --no-audit --no-fund

      - name: Web build (bundle, runtime assets, sub-path URL check, size budget)
        run: npm run build
